services:
  - type: web
    name: weather-aware-truck-routing-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 3
    envVars:
      - key: PYTHON_VERSION
        value: '3.11'
      - key: DEBUG
        value: 'False'
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: 'weather-aware-truck-routing-api.onrender.com,localhost,127.0.0.1'
      - key: CORS_ALLOWED_ORIGINS
        value: 'https://weather-aware-truck-routing.vercel.app,http://localhost:5173'
      - key: FRONTEND_URL
        value: 'https://weather-aware-truck-routing.vercel.app'
